name = "ephikorea"
compatibility_date = "2026-05-27"
compatibility_flags = ["nodejs_compat"]

[vars]
CLOUDFLARE_BINDINGS = "1"

[[d1_databases]]
binding = "DB"
database_name = "ephikorea"
database_id = "replace-with-cloudflare-d1-database-id"

[[r2_buckets]]
binding = "PRODUCT_MEDIA"
bucket_name = "ephikorea-product-media"
